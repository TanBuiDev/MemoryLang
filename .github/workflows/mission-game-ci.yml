name: Mission Game CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/games/mission/**'
      - 'src/pages/games/Mission*.tsx'
      - 'src/services/supabase/gameMission.service.ts'
      - 'src/services/local/gameMissionLocalDb.ts'
      - 'src/pages/games/GameHubPage.tsx'
      - 'src/pages/admin/AdminGamesPage.tsx'
      - 'src/app/routes.tsx'
      - 'src/types/study.types.ts'
      - 'src/features/study/studyLabels.ts'
      - 'supabase/migrations/*mission*.sql'
      - '.github/workflows/mission-game-ci.yml'

jobs:
  mission-game:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mission unit tests
        run: pnpm exec vitest run src/features/games/mission/missionEngine.test.ts

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
