<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function reloadWithLimit() {
          var lastReload = sessionStorage.getItem('last_asset_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload) > 15000) {
            sessionStorage.setItem('last_asset_reload', now.toString());
            window.location.reload();
          }
        }
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'LINK' || target.tagName === 'SCRIPT')) {
            var url = target.src || target.href;
            if (url && url.indexOf('/assets/') !== -1) {
              reloadWithLimit();
            }
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (
            e.reason.name === 'ChunkLoadError' || 
            (e.reason.message && e.reason.message.indexOf('Failed to fetch dynamically imported module') !== -1)
          )) {
            reloadWithLimit();
          }
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FDC800" />
    <meta name="description" content="MemoryLang — Học từ vựng thông minh với flashcard và spaced repetition. Hỗ trợ 8+ ngôn ngữ." />
    <meta property="og:title" content="MemoryLang — Vocabulary Learning & Spaced Repetition" />
    <meta property="og:description" content="Học từ vựng thông minh với flashcard và spaced repetition. Hỗ trợ 8+ ngôn ngữ." />
    <meta property="og:type" content="website" />
    <title>MemoryLang — Vocabulary Learning & Spaced Repetition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Eruda: Mobile DevTools (temporary — remove after debugging) -->
    <script src="/eruda-loader.js"></script>
  </body>
</html>
