<svg xmlns="http://www.w3.org/2000/svg" width="260" height="240" viewBox="0 0 260 240" role="img" aria-label="MemoryLang logo" shape-rendering="geometricPrecision">

<defs>
  <style>
    .navy{fill:#1C293C;}
    .yellow{fill:#FDC800;}
    .purple{fill:#432DD7;}
    .off{fill:#FBFBF9;}
    .stroke{stroke:#1C293C;stroke-width:8;stroke-linejoin:round;stroke-linecap:round;}
    .stroke6{stroke:#1C293C;stroke-width:6;stroke-linejoin:round;stroke-linecap:round;}
    .text{font-family: Inter, Arial, Helvetica, sans-serif; font-weight:900; letter-spacing:-4px;}
  </style>
</defs>


<g transform="translate(40 35) scale(1.05)">
